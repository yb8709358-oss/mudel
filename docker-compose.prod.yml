# =============================================================================
# Mudel — Production Compose (Oracle Cloud + Supabase PostgreSQL)
# =============================================================================
#
# The ONLY production database is Supabase PostgreSQL. This stack intentionally
# does NOT run a Postgres container — the backend connects to Supabase through
# DATABASE_URL. It runs:
#
#   proxy     (nginx)   — TLS termination, ONLY public entry (ports 80/443)
#   backend   (FastAPI) — connects to Supabase via DATABASE_URL
#   migrate   (alembic) — one-shot DB migration before backend starts
#   frontend  (Next.js) — NEXT_PUBLIC_* baked at build time
#   redis     (rate limiting / caching)
#
# Usage:
#   cp .env.example .env        # fill in production values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# SECURITY:
#   - TLS is terminated by the nginx proxy service. The backend sends HSTS only
#     over https and admin cookies are Secure-only in production — both rely on
#     TLS being terminated at the proxy, which forwards X-Forwarded-Proto.
#     Ports 8000 (backend) and 3001 (frontend) are NOT published to the host:
#     the proxy is the only way in. Run `docker compose port` / exec into
#     containers for debugging.
#   - DB_HOST/DB_USER/DB_PASSWORD/DB_NAME must NOT be set here. They are only a
#     fallback the backend uses when DATABASE_URL is empty; DATABASE_URL always
#     takes precedence whenever it is set. Production passes DATABASE_URL
#     directly (see x-backend-env below).
#   - SUPABASE_SERVICE_ROLE_KEY is server-side only (backend). It is never
#     exposed to the frontend and never placed in a NEXT_PUBLIC_* variable.
#   - ADMIN_PASSWORD / ADMIN_API_SECRET are read by the Next.js server only;
#     they are runtime environment variables, never part of the bundle.
#
# TLS CERTIFICATES: place fullchain.pem + privkey.pem in ./certs (mounted
# read-only into the proxy). See deploy/nginx.conf.
#
# BUILD-TIME REQUIREMENT: the frontend image is built while NEXT_PUBLIC_API_URL
# must already be REACHABLE from the build machine. Static pages (SSG) fetch
# their content at build time; service slug pages use generateStaticParams, so
# building against an unreachable API produces a site whose /services/<slug>
# pages return 500 until the image is rebuilt with a live API. On first deploy,
# bring the backend up and confirm the public API origin responds before
# building the frontend.
# =============================================================================

x-backend-env: &backend-env
  # Supabase connection string (pgBouncer transaction pooler, port 6543).
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the Supabase connection string}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  ADMIN_API_SECRET: ${ADMIN_API_SECRET:?ADMIN_API_SECRET must be set}
  CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-hello@mudel.ma}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be a JSON array of allowed browser origins}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-request-images}
  # WhatsApp Cloud API integration
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
  WHATSAPP_ADMIN_PHONE: ${WHATSAPP_ADMIN_PHONE:-}
  ENVIRONMENT: production
  DEBUG: "False"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mudel-prod-network

  # ===========================================================================
  # Backend (FastAPI + Uvicorn) — Supabase PostgreSQL is the data store.
  # Starts only after `migrate` has applied the Alembic schema successfully.
  # --forwarded-allow-ips=* makes uvicorn trust the proxy's X-Forwarded-Proto
  # so request.url.scheme is https behind nginx (the SecurityHeadersMiddleware
  # then emits HSTS). Safe here: only the nginx proxy can reach this container.
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--forwarded-allow-ips=*"]
    networks:
      - mudel-prod-network

  # ===========================================================================
  # Migrate — one-shot Alembic upgrade against Supabase (runs before backend).
  # Idempotent: safe on every deploy; fails loudly (no --exit-on-error swallow)
  # if a migration is broken, preventing the backend from starting on a
  # half-migrated schema.
  # ===========================================================================
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    networks:
      - mudel-prod-network

  # ===========================================================================
  # Frontend (Next.js standalone server)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time — must be the public URLs.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the public API origin}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set to the canonical site origin}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set to the public app origin}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Mudel}
    restart: unless-stopped
    environment:
      # Server-only admin credentials — never NEXT_PUBLIC_ (never in the bundle).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:?ADMIN_API_SECRET must be set}
    depends_on:
      - backend
    networks:
      - mudel-prod-network

  # ===========================================================================
  # Proxy — nginx TLS termination. The ONLY publicly exposed service (80/443).
  # Routes mudel.ma -> frontend:3001 and api.mudel.ma -> backend:8000.
  # ===========================================================================
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mudel-prod-network

networks:
  mudel-prod-network:
    driver: bridge

volumes:
  prod_redis_data:
