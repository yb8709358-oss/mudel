# =============================================================================
# Mudel Backend — CI/CD Pipeline
# =============================================================================
#
# BADGES (add to README.md):
#
#   ![Quality](https://github.com/<OWNER>/<REPO>/actions/workflows/backend.yml/badge.svg?job=quality)
#   ![Tests](https://github.com/<OWNER>/<REPO>/actions/workflows/backend.yml/badge.svg?job=test)
#   ![Docker](https://github.com/<OWNER>/<REPO>/actions/workflows/backend.yml/badge.svg?job=docker)
#
# Replace <OWNER> and <REPO> with your GitHub username/org and repository name.
#
# PIPELINE OVERVIEW:
#
#   push/PR ──► quality (lint + typecheck)  ─┐
#             ──► test    (pytest + migrate) ─┼──► docker (build + smoke test)
#                                             │
#   quality and test run in parallel;         │
#   docker waits for both to pass.            │
#
# =============================================================================

name: Backend CI/CD

# ---------------------------------------------------------------------------
# TRIGGER CONFIGURATION
# ---------------------------------------------------------------------------
# Run on every push and pull_request to main or develop.
# Only trigger when backend files change — ignore frontend, docs, etc.
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# ---------------------------------------------------------------------------
# ENVIRONMENT VARIABLES (shared across all jobs)
# ---------------------------------------------------------------------------
env:
  PYTHON_VERSION: "3.12"
  # Force Python to output unbuffered logs so CI captures them in real-time
  PYTHONUNBUFFERED: "1"
  # Prevent Python from writing .pyc files (faster CI, cleaner caches)
  PYTHONDONTWRITEBYTECODE: "1"

# ---------------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------------
jobs:
  # =========================================================================
  # JOB 1: QUALITY — Linting + Type Checking
  # =========================================================================
  # Runs ruff (linting + formatting) and mypy (static type analysis).
  # No database or external services required.
  #
  # This is the fastest feedback loop — developers see lint/type errors
  # within ~30 seconds of pushing.
  # =========================================================================
  quality:
    name: Quality (Lint + Typecheck)
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # Step 1: Clone the repository
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Step 2: Set up Python with pip caching
      # ------------------------------------------------------------------
      # Caches pip's download cache (~/.cache/pip) keyed by requirements files.
      # First run: ~60s to install. Cached runs: ~15s.
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt

      # ------------------------------------------------------------------
      # Step 3: Install Python dependencies
      # ------------------------------------------------------------------
      # Installs both base and dev requirements (includes ruff + mypy).
      - name: Install dependencies
        run: pip install -r backend/requirements/dev.txt

      # ------------------------------------------------------------------
      # Step 4: Ruff — Linting
      # ------------------------------------------------------------------
      # Checks for bugs, security issues, import ordering, and style.
      # --exit-non-zero-on-fix ensures the step fails if ruff finds issues.
      # Fails fast — no point running format check if lint fails.
      - name: Ruff lint
        run: ruff check backend/app

      # ------------------------------------------------------------------
      # Step 5: Ruff — Formatting
      # ------------------------------------------------------------------
      # Verifies consistent code formatting (Black-compatible).
      # --check exits with non-zero if any file would be reformatted.
      - name: Ruff format
        run: ruff format --check backend/app

      # ------------------------------------------------------------------
      # Step 6: Mypy — Static Type Checking
      # ------------------------------------------------------------------
      # Strict mode catches type errors before runtime.
      # Config is in backend/pyproject.toml [tool.mypy].
      # Per-module overrides ignore missing stubs for third-party libs
      # (slowapi, aiosqlite) that don't ship type annotations.
      - name: Mypy type check
        run: mypy backend/app

  # =========================================================================
  # JOB 2: TEST — Unit Tests + Alembic Migration Verification
  # =========================================================================
  # Runs the full test suite with coverage, then verifies all Alembic
  # migrations apply cleanly against a real PostgreSQL database.
  #
  # Uses a PostgreSQL 16 service container (runs alongside the job).
  # Coverage report is uploaded as a downloadable artifact.
  # =========================================================================
  test:
    name: Test (Pytest + Alembic)
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # SERVICE CONTAINERS
    # ------------------------------------------------------------------
    # Spins up a real PostgreSQL 16 instance for migration verification.
    # The container runs until the job completes and is automatically cleaned up.
    # Health check ensures PostgreSQL is accepting connections before steps run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mudel_test
          POSTGRES_USER: mudel
          POSTGRES_PASSWORD: mudel_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mudel -d mudel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    # ------------------------------------------------------------------
    # JOB-LEVEL ENVIRONMENT VARIABLES
    # ------------------------------------------------------------------
    # DATABASE_URL points to the PostgreSQL service container above.
    # ENVIRONMENT=testing skips production validators (no real secrets needed).
    # REDIS_URL is left empty — rate limiter falls back to in-memory for tests.
    env:
      DATABASE_URL: postgresql://mudel:mudel_test_ci@localhost:5432/mudel_test
      ENVIRONMENT: testing
      DEBUG: "True"
      ADMIN_API_SECRET: test-secret-ci
      CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      # ------------------------------------------------------------------
      # Step 1: Clone the repository
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Step 2: Set up Python with pip caching
      # ------------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt

      # ------------------------------------------------------------------
      # Step 3: Install Python dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r backend/requirements/dev.txt

      # ------------------------------------------------------------------
      # Step 4: Alembic — Verify Migrations
      # ------------------------------------------------------------------
      # Runs ALL migrations from 0000 → latest against the CI database.
      # This catches:
      #   - Broken migration files (syntax errors, bad SQL)
      #   - Missing model imports (env.py can't resolve targets)
      #   - Conflicts between migration branches
      #   - Downgrade/upgrade path issues
      #
      # If this fails, the migration files need fixing before merge.
      - name: Alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://mudel:mudel_test_ci@localhost:5432/mudel_test
        run: alembic upgrade head

      # ------------------------------------------------------------------
      # Step 5: Pytest — Unit Tests with Coverage
      # ------------------------------------------------------------------
      # --cov=app              : Measure coverage of backend/app/
      # --cov-report=xml       : Generate coverage.xml for CI tools / uploads
      # --cov-report=term      : Print coverage summary in the CI log
      # --cov-fail-under=70    : FAIL the pipeline if coverage drops below 70%
      #                         (matches backend/pyproject.toml)
      # -v                     : Verbose output (shows test names, not just dots)
      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      # ------------------------------------------------------------------
      # Step 6: Upload Coverage Report
      # ------------------------------------------------------------------
      # Makes coverage.xml downloadable from the Actions summary page.
      # Useful for integrating with Codecov, Coveralls, or SonarQube later.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30
          if-no-files-found: warn

  # =========================================================================
  # JOB 3: DOCKER — Build + Smoke Test
  # =========================================================================
  # Builds the multi-stage Docker image and runs a lightweight smoke test
  # to verify the app can be imported and the container starts correctly.
  #
  # Depends on quality + test passing first — no point building Docker
  # images for code that fails linting or tests.
  # =========================================================================
  docker:
    name: Docker (Build + Smoke Test)
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      # ------------------------------------------------------------------
      # Step 1: Clone the repository
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Step 2: Build Docker image
      # ------------------------------------------------------------------
      # Uses the multi-stage Dockerfile in backend/Dockerfile.
      # Build context is the backend/ directory.
      # --load makes the image available to docker run in the next step.
      - name: Build Docker image
        run: docker build -t mudel-backend backend

      # ------------------------------------------------------------------
      # Step 3: Smoke test — verify the app imports successfully
      # ------------------------------------------------------------------
      # Runs a temporary container that executes a Python import check.
      # ENVIRONMENT=testing skips the production validator and DATABASE_URL is a
      # throwaway URL (the container never connects — this is an import check
      # only; the config now fails fast when DATABASE_URL is missing entirely).
      #
      # This catches:
      #   - Missing dependencies in the Docker image
      #   - Broken imports that only surface in the production-like environment
      #   - Config errors that crash at import time
      #   - Missing system libraries (e.g., libpq for asyncpg)
      - name: Smoke test — import verification
        run: >-
          docker run --rm
          -e ENVIRONMENT=testing
          -e DATABASE_URL=postgresql://test:test@localhost:5432/test
          mudel-backend
          python -c "from app.main import app; print(f'App loaded: {app.title} v{app.version}')"
