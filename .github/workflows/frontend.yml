# =============================================================================
# Mudel Frontend — CI Pipeline
# =============================================================================
#
# Runs typecheck + lint on every push/PR that touches frontend files.
#
# NOTE: `npm run build` is intentionally NOT run here. The Next.js app
# statically renders public pages that fetch from the FastAPI backend, so a
# build in CI would require a live backend (or a fixture/mock). Typecheck and
# lint already cover the frontend correctness; run build locally with the
# backend up, or point NEXT_PUBLIC_API_URL at a staging instance.
#
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  check:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
