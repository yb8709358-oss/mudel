# =============================================================================
# Mudel — TLS-terminating reverse proxy (nginx)
# =============================================================================
# Routes the two public origins to the internal services over the compose
# network. Backend (8000) and frontend (3001) are intentionally NOT published
# to the host — the only public entry points are ports 80/443 of this service.
#
# Certificates: place your fullchain and private key at
#   ./certs/fullchain.pem
#   ./certs/privkey.pem
# (e.g. from Let's Encrypt / Certbot). nginx mounts ./certs read-only.
#
# Domain names: adjust the server_name blocks if your production domains
# differ from mudel.ma / api.mudel.ma. Keep both 80 (redirect) and 443 blocks
# in sync. The API origin must match NEXT_PUBLIC_API_URL and the backend
# CORS_ORIGINS.
#
# X-Forwarded-Proto is forwarded so the FastAPI security middleware emits HSTS
# and uvicorn sees the original https scheme behind the proxy.
# =============================================================================

# ---------------------------------------------------------------------------
# Site (frontend, Next.js standalone server on port 3001)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name mudel.ma www.mudel.ma;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mudel.ma www.mudel.ma;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    location / {
        proxy_pass http://frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ---------------------------------------------------------------------------
# API (backend, FastAPI + uvicorn on port 8000)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.mudel.ma;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.mudel.ma;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Request image uploads (multipart) can exceed the default 1m limit.
    client_max_body_size 10m;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
